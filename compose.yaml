services:
  ugreen-lights:
    build: .
    image: ugreen-lights:latest
    container_name: ugreen-lights
    restart: unless-stopped

    # The LED controller lives on the SMBus/I2C bus. The `i2c-dev` module must
    # be loaded on the TrueNAS HOST first (see README). Then expose the bus:
    devices:
      - /dev/i2c-0:/dev/i2c-0      # the "SMBus I801 adapter" bus (i2c-0 on DXP4800 Plus)
      # For SMART checks and reliable disk enumeration, expose the data disks.
      # Simpler alternative: use `privileged: true` below and drop this block.
      - /dev/sda:/dev/sda
      - /dev/sdb:/dev/sdb
      - /dev/sdc:/dev/sdc
      - /dev/sdd:/dev/sdd

    # ZFS lives in the host kernel; the container's `zpool` talks to it via this.
    volumes:
      - /dev/zfs:/dev/zfs
      # Optional: drop overrides here instead of using environment: below.
      # - ./ugreen-leds.conf:/etc/ugreen-leds.conf:ro

    # Needed so `zpool status` can read host pool state and lsblk sees the bays.
    pid: host

    environment:
      UPDATE_INTERVAL: "5"
      NUM_BAYS: "4"
      BRIGHTNESS: "64"
      CHECK_SMART: "true"
      CHECK_GATEWAY: "true"
      # NETDEV_NAME: "enp2s0"   # leave unset to auto-detect from default route

    # If device passthrough is fiddly on your TrueNAS version, the blunt option:
    # privileged: true
