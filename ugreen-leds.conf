# ugreen-leds.conf — optional overrides for lights.sh
#
# Mount this at /etc/ugreen-leds.conf (or point $CONF_FILE at it). Everything
# here is also settable as an environment variable; this file is sourced last,
# so any value you uncomment below wins. All values shown are the defaults.

# --- Hardware / mapping ---
# NUM_BAYS=4               # 4 = DXP4800 Plus, 2 = DXP2800
# MAPPING_METHOD=hctl      # hctl (default) or serial
# HCTL_OFFSET=1            # (hctl) diskLED = (SCSI host number) + HCTL_OFFSET
# DISK_SERIAL=""           # (serial) serials in physical bay order, e.g.
#                          #   DISK_SERIAL="SN_BAY1 SN_BAY2 SN_BAY3 SN_BAY4"
#                          # find them (in the container) with:
#                          #   lights.sh --map     (prints the serial per bay)
#                          # on the host you can also use: lsblk -S -o NAME,SERIAL,MODEL
# UGREEN_CLI=/app/ugreen_leds_cli

# --- Behavior ---
# BRIGHTNESS=64            # 0-255; raise if the LEDs look dim
# BLINK_ON=400            # blink on-time  (ms)
# BLINK_OFF=600           # blink off-time (ms)
# CHECK_SMART=true         # needs smartmontools + raw disks in the container
# CHECK_GATEWAY=true       # ping default gateway for the network LED
# NETDEV_NAME=             # empty = auto-detect from default route (e.g. enp2s0)

# --- Colors (R G B) ---
# COLOR_HEALTHY="0 255 0"       # disk online & healthy      (green)
# COLOR_FAULT="255 0 0"         # faulted/degraded/removed   (red)
# COLOR_WARN="255 90 0"         # offline/errors/SMART/resilver (amber)
# COLOR_AVAIL="0 0 255"         # present but not in a pool  (blue)
# COLOR_POWER_OK="255 255 255"  # all pools healthy          (white)
# COLOR_NET_OK="0 255 0"        # network up + reachable     (green)
